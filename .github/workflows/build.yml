name: Build

# Compila a ogni push su main (e sulle pull request). NON pubblica nulla:
# serve a vedere subito se l'APK compila. Per pubblicare usa il workflow "Release".
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # default "tools" non esiste piu: pacchetti espliciti
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Test della logica (core)
        run: ./gradlew :core:test

      - name: Compila APK e JAR
        run: ./gradlew :android:assembleDebug :desktop:fatJar

      - uses: actions/upload-artifact@v4
        with:
          name: megane-diag-build
          path: |
            android/build/outputs/apk/debug/android-debug.apk
            desktop/build/libs/megane-desktop.jar
