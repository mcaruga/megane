# Anti brute-force sul login: 30 richieste/minuto per IP (+ raffica di 10).
# Il limite scatta PRIMA del controllo password, quindi conta anche i tentativi falliti.
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

# IP vero dietro Cloudflare tunnel (cloudflared -> rete docker)
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name megane.omniking.cc localhost _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /INSTALLA.md {
        default_type "text/plain; charset=utf-8";
    }

    # elenco versioni: pubblico, mai in cache (lo scrive docker/rilascia.sh)
    location = /downloads/versions.txt {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-store";
    }

    # ultima versione: pubblica
    location /downloads/ {
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
            application/java-archive jar;
        }
        add_header Content-Disposition "attachment";
    }

    # versioni precedenti: protette da password
    location /downloads/archivio/ {
        auth_basic "Megane Diag - rilasci";
        auth_basic_user_file /etc/nginx/htpasswd;
        limit_req zone=auth burst=20 nodelay;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
            application/java-archive jar;
        }
        add_header Content-Disposition "attachment";
    }

    # gestionale rilasci: protetto da password
    location /rilasci/ {
        auth_basic "Megane Diag - rilasci";
        auth_basic_user_file /etc/nginx/htpasswd;
        limit_req zone=auth burst=20 nodelay;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex";
    }

    # candidati da approvare: scaricabili per provarli, solo con password
    location /rilasci/candidati/ {
        auth_basic "Megane Diag - rilasci";
        auth_basic_user_file /etc/nginx/htpasswd;
        limit_req zone=auth burst=20 nodelay;
        alias /srv/candidati/;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
            application/java-archive jar;
        }
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-store";
    }

    # API gestionale (approva / scarta / build)
    location /rilasci/api/ {
        auth_basic "Megane Diag - rilasci";
        auth_basic_user_file /etc/nginx/htpasswd;
        limit_req zone=auth burst=20 nodelay;
        client_max_body_size 8k;
        proxy_pass http://megane-api:8000/;
        proxy_set_header Authorization "";
        add_header Cache-Control "no-store";
    }
}
